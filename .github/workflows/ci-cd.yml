# ============================================================
# PDFBlack — CI/CD Pipeline (GitHub Actions - Ultra Rápido)
# ============================================================
# Optimizado para despliegues ultra rápidos a pdf-black.com (~1.5 - 2 min)
# Elimina compilación pesada de Docker y pasos redundantes duplicados.

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: 1

# Concurrency: cancela runs anteriores del mismo PR/branch para evitar esperas y colas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Verificación para PRs y ramas secundarias
  # ────────────────────────────────────────────────
  lint-and-types:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────
  # Job 2: Deploy Ultra Rápido a Firebase (solo en main)
  # ────────────────────────────────────────────────
  deploy-firebase:
    name: Deploy to Firebase Hosting (pdf-black.com)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PDFBLACK_PROY }}

      - name: Deploy to Firebase Hosting & Cloud Run
        run: npx firebase-tools deploy --only hosting --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

  # ────────────────────────────────────────────────
  # Job 3: Deploy Microservicio Cloud Run (pdfblack-converter)
  # ────────────────────────────────────────────────
  deploy-converter:
    name: Deploy Cloud Run Converter (pdfblack-converter)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Detectar cambios en motor de conversión
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            converter:
              - 'cloudrun/**'
              - 'server/**'

      - name: Sincronizar scripts de server/ a cloudrun/
        if: steps.filter.outputs.converter == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cp -f server/pdf2docx_official_convert.py cloudrun/pdf2docx_official_convert.py || true
          cp -f server/brochure_engine.py cloudrun/brochure_engine.py || true

      - name: Authenticate to Google Cloud
        if: steps.filter.outputs.converter == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PDFBLACK_PROY }}

      - name: Setup Google Cloud SDK
        if: steps.filter.outputs.converter == 'true' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        if: steps.filter.outputs.converter == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd cloudrun
          gcloud run deploy pdfblack-converter \
            --source . \
            --project pdfblack-proy \
            --region us-central1 \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10

