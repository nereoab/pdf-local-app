# ============================================================
# PDFBlack — CI/CD Pipeline (GitHub Actions - Ultra Rápido)
# ============================================================
# Optimizado para despliegues ultra rápidos a pdf-black.com (~1.5 - 2 min)
# Elimina compilación pesada de Docker y pasos redundantes duplicados.

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: 1

# Concurrency: cancela runs anteriores del mismo PR/branch para evitar esperas y colas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Verificación para PRs y ramas secundarias
  # ────────────────────────────────────────────────
  lint-and-types:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # ────────────────────────────────────────────────
  # Job 2: Deploy Ultra Rápido a Firebase (solo en main)
  # ────────────────────────────────────────────────
  deploy-firebase:
    name: Deploy to Firebase Hosting (pdf-black.com)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PDFBLACK_PROY }}

      - name: Deploy to Firebase Hosting & Cloud Run
        run: npx firebase-tools deploy --only hosting --non-interactive
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks